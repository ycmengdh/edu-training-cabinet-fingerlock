; PlatformIO config - Root Node (Mesh root + SD data center + TFT display)
; ESP32-S3 with 0.96" TFT (ST7735 80x160), SD_MMC 1-bit, Serial uplink
[platformio]
default_envs = root

[env:root]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = ../common/partitions_16MB_log.csv
build_flags =
    ; Lower WiFi library log noise (NO_AP_FOUND spam was CORE_DEBUG_LEVEL=3)
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DCONFIG_FATFS_LFN_HEAP=1
    ; loop 任务栈 32KB（REGISTER 权限同步 + Mesh + Json 调用链更深）：root 主循环调用链很深
    ; loop -> MeshComm::update -> processReceivedMessage -> onMeshMessage
    ;   -> handleMeshMessage -> SdStorage::readTable/writeTable -> FATFS
    ; 加上 ArduinoJson deserializeJson 内部栈使用 + DynamicJsonDocument
    ; 嵌套分配，8KB 临界，长时间运行可能栈溢出导致"后面就不行了"。
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
    ; Hardware host port is USB-Serial-JTAG (GPIO19/20), not classic UART0.
    ; On ESP32-S3 this is Arduino Serial when USB CDC is enabled.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_SD_CARD
    -DBOARD_HAS_PSRAM
    -I../common
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    TFT_eSPI
    lvgl
    SD
    FS
    SPI
lib_extra_dirs =
    ..
lib_ignore =
    lvgl
    root_node
    cabinet_node
