; PlatformIO config - Root Node (Mesh root + SD data center + TFT display)
; ESP32-S3 with 0.96" TFT (ST7735 80x160), SD_MMC 1-bit, Serial uplink
[platformio]
default_envs = root

[env:root]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
board_build.flash_size = 16MB
board_build.partitions = default.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DCONFIG_FATFS_LFN_HEAP=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DENABLE_SD_CARD
    -I../common
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    TFT_eSPI
    lvgl
    SD
    FS
    SPI
lib_extra_dirs =
    ..
lib_ignore =
    lvgl
    root_node
    cabinet_node
