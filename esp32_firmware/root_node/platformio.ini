; PlatformIO config - Root Node
[platformio]
default_envs = root_uart0_min

[env:root]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = ../common/partitions_16MB_log.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DCONFIG_FATFS_LFN_HEAP=1
    ; Hardware host port is USB-Serial-JTAG (GPIO19/20), not classic UART0.
    ; On ESP32-S3 this is Arduino Serial when USB CDC is enabled.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_SD_CARD
    -DBOARD_HAS_PSRAM
    -I../common
    -Isrc
    -DLV_CONF_INCLUDE_SIMPLE=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    TFT_eSPI
    lvgl
    SD
    FS
    SPI
lib_extra_dirs =
    ..
lib_ignore =
    lvgl
    root_node
    cabinet_node

[env:root_comm_test]
extends = env:root
build_flags =
    ${env:root.build_flags}
    -UENABLE_SD_CARD
    -DROOT_DISABLE_TFT=1

; Minimal app on USB-Serial-JTAG (GPIO19/20). No Mesh/SD/TFT/PSRAM.
[env:root_uart0_min]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = ../common/partitions_16MB_log.csv
build_src_filter =
    +<../src_comm_minimal/>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
