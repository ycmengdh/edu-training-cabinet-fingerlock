[platformio]
src_dir = src
default_envs = cabinet

[env:cabinet]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
; Hardware: ESP32-S3 N16R8 = 16MB Quad SPI Flash + 8MB Octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = ../common/partitions_16MB_log.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DCONFIG_FATFS_LFN_HEAP=1
    ; loop 任务栈从默认 8KB 增到 16KB：柜子主循环调用链
    ; loop -> MeshComm::update -> processReceivedMessage -> onMessageReceived
    ;   -> MessageHandler::handleIncoming -> DynamicJsonDocument(64KB) + 业务处理
    ; 加上 AS608 指纹采集、锁控制等深度调用，8KB 临界。
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Cabinet host/debug link is classic UART0 (U0TXD=GPIO43, U0RXD=GPIO44),
    ; same baud/protocol as root USB uplink, but NOT USB-Serial-JTAG/CDC.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -I../common
    -Isrc
lib_extra_dirs =
    ..
lib_ignore =
    root_node
    cabinet_node
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    bblanchon/ArduinoJson @ ^6.21.5
